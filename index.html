    tailwind.config = {

  <style>
    html, body { background: #000; color: #fff; scroll-behavior: smooth; }
    body { font-family: 'Barlow', sans-serif; -webkit-font-smoothing: antialiased; }

    /* Liquid glass — subtle */
    .liquid-glass {
      background: rgba(255,255,255,0.02);
      background-blend-mode: luminosity;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%,
        rgba(255,255,255,0.45) 100%);
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Liquid glass — strong (CTA) */
    .liquid-glass-strong {
      background: rgba(255,255,255,0.04);
      background-blend-mode: luminosity;
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: none;
      box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass-strong::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.5) 0%,
        rgba(255,255,255,0.2) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.2) 80%,
        rgba(255,255,255,0.5) 100%);
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
  </style>

  <script>
    (function () {
      const origError = console.error;
      console.error = function (...args) {
        const msg = args[0];
        if (typeof msg === "string" && (msg.includes("unique \"key\" prop") || msg.includes("Each child in a list"))) {
          return;
        }
        return origError.apply(console, args);
      };
    })();
  </script>
